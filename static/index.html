<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D游戏素材生成器</title>
<style>
/* ===== Variables ===== */
:root {
    --primary: #1976d2;
    --primary-light: #e3f2fd;
    --primary-dark: #0d47a1;
    --success: #4caf50;
    --success-light: #e8f5e9;
    --success-dark: #2e7d32;
    --danger: #d32f2f;
    --danger-light: #ffebee;
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #333333;
    --text-muted: #9e9e9e;
    --border: #e0e0e0;
    --sidebar-width: 200px;
    --radius: 8px;
}

/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ===== Layout ===== */
.app { display: flex; min-height: 100vh; }
.sidebar { width: var(--sidebar-width); background: #fafafa; border-right: 1px solid var(--border); padding: 20px 12px; flex-shrink: 0; }
.sidebar-title { font-weight: 700; font-size: 15px; color: var(--text); margin-bottom: 16px; }
.content { flex: 1; padding: 24px 32px; overflow-y: auto; }
.page { display: none; }
.page.active { display: block; }

/* ===== Steps ===== */
.step-item { display: flex; align-items: stretch; gap: 0; }
.step-marker { display: flex; flex-direction: column; align-items: center; width: 30px; flex-shrink: 0; }
.step-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: bold; flex-shrink: 0; line-height: 1; }
.step-line { width: 2px; height: 22px; margin: 0 auto; }
.step-label { padding: 4px 10px; margin-bottom: 2px; border-radius: 4px; font-size: 13px; flex: 1; align-self: center; }

.step-done .step-dot { background: var(--success); }
.step-done .step-line { background: var(--success); }
.step-done .step-label { background: var(--success-light); color: var(--success-dark); }

.step-current .step-dot { background: var(--primary); }
.step-current .step-line { background: var(--border); }
.step-current .step-label { background: var(--primary-light); color: var(--primary-dark); font-weight: bold; }

.step-future .step-dot { background: var(--border); }
.step-future .step-line { background: var(--border); }
.step-future .step-label { background: transparent; color: var(--text-muted); }

/* ===== Cards & Buttons ===== */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 20px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; cursor: pointer; background: var(--card); color: var(--text); transition: all .15s; gap: 6px; }
.btn:hover { filter: brightness(0.96); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-lg { padding: 12px 28px; font-size: 16px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.col { flex: 1; min-width: 0; }
.col-2 { flex: 2; min-width: 0; }
h1 { font-size: 24px; margin-bottom: 8px; }
h2 { font-size: 20px; margin-bottom: 12px; }
h3 { font-size: 16px; margin-bottom: 8px; color: #555; }

/* ===== Form Elements ===== */
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #555; }
input, textarea, select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-family: inherit; background: #fafafa; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
textarea { resize: vertical; min-height: 60px; }
select { cursor: pointer; }
.form-group { margin-bottom: 12px; }
.checkbox-row { display: flex; align-items: center; gap: 8px; }
.checkbox-row input[type=checkbox] { width: auto; }

/* ===== Image Gallery ===== */
.image-gallery { display: flex; gap: 12px; margin: 12px 0; }
.image-gallery img { width: 32%; aspect-ratio: 1; object-fit: cover; border: 2px solid var(--border); border-radius: 6px; }
.image-gallery img.selected { border-color: var(--primary); }
.image-preview { max-width: 100%; max-height: 400px; border-radius: 6px; border: 1px solid var(--border); }

/* ===== Status ===== */
.status { padding: 8px 12px; border-radius: 6px; font-size: 13px; margin: 8px 0; min-height: 20px; }
.status-error { background: var(--danger-light); color: var(--danger); }
.status-success { background: var(--success-light); color: var(--success-dark); }

/* ===== Dividers ===== */
.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

/* ===== Download Link ===== */
.download-link { display: none; color: var(--primary); text-decoration: none; font-size: 14px; }
.download-link.show { display: inline-block; }

/* ===== Spinner ===== */
.spinner { display: none; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-left: 6px; }
.btn:disabled .spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
        <div class="sidebar-title">流程进度</div>
        <div id="stepsContainer"></div>
    </aside>

    <!-- ===== Main Content ===== -->
    <main class="content">
        <!-- Home Page -->
        <div id="page-home" class="page active">
            <div class="card">
                <h1>2D游戏素材生成器</h1>
                <h3>选择模式</h3>
                <div class="row" style="margin-top:16px">
                    <button class="btn btn-primary btn-lg" onclick="navToGenerate()">图片生成</button>
                    <button class="btn btn-lg" onclick="navToEditUpload()">图片编辑</button>
                </div>
            </div>
        </div>

        <!-- Generate Page -->
        <div id="page-generate" class="page">
            <div class="card">
                <h2>图片生成</h2>
                <div class="row" style="align-items:flex-start">
                    <div class="col">
                        <div class="form-group"><label>内容描述</label><textarea id="genContent" placeholder="描述你想要生成的图片内容..." rows="3"></textarea></div>
                        <div class="form-group"><label>风格描述</label><input id="genStyle" placeholder="例如：像素风格、水墨风格、水彩风格"></div>
                        <div class="form-group"><label>图片尺寸</label><select id="genSize"><option>2048*2048</option><option>2688*1536</option><option>1536*2688</option><option>2368*1728</option><option>1728*2368</option></select></div>
                        <div class="form-group"><div class="checkbox-row"><input type="checkbox" id="genTransparent"><label style="margin:0">透明背景</label></div></div>
                        <div class="row">
                            <button class="btn btn-primary" id="genBtn" onclick="handleGenerate()">生成图像</button>
                            <button class="btn" id="regenBtn" onclick="handleRegenerate()">重新生成</button>
                        </div>
                        <div style="margin-top:8px">
                            <button class="btn btn-danger btn-sm" onclick="handleResetGen()">重置</button>
                            <button class="btn btn-sm" onclick="showPage('home')">← 返回首页</button>
                        </div>
                    </div>
                    <div class="col-2">
                        <div id="genStatus" class="status"></div>
                        <div class="image-gallery" id="imageGallery">
                            <img src="" alt="图1" id="genImg1" style="display:none" onclick="selectGenImage(0)">
                            <img src="" alt="图2" id="genImg2" style="display:none" onclick="selectGenImage(1)">
                            <img src="" alt="图3" id="genImg3" style="display:none" onclick="selectGenImage(2)">
                        </div>
                        <div class="form-group"><label>选择编辑目标</label><select id="genSelect"><option>图1</option></select></div>
                        <button class="btn btn-primary btn-lg" onclick="handleEnterEdit()">进入编辑 →</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Page -->
        <div id="page-edit" class="page">
            <div class="card">
                <div class="row" style="justify-content:space-between">
                    <h2>图片编辑</h2>
                    <button class="btn btn-sm" onclick="showPage('home')">← 返回首页</button>
                </div>
                <div class="row" style="align-items:flex-start">
                    <div class="col">
                        <div class="form-group"><label>上传新图片（或从生成页进入已加载）</label><input type="file" id="editUpload" accept="image/*" onchange="handleUpload(this)"></div>
                        <img id="editImage" class="image-preview" src="" alt="当前图片" style="display:none">
                        <div id="editStatus" class="status"></div>
                    </div>
                    <div class="col">
                        <h3>编辑操作</h3>
                        <div class="form-group"><label>编辑指令</label><textarea id="editInstruction" placeholder="描述你要修改的内容..." rows="2"></textarea></div>
                        <div class="row">
                            <button class="btn btn-primary" id="editSubmitBtn" onclick="handleEditSubmit()">提交编辑</button>
                            <button class="btn btn-danger" id="undoBtn" style="display:none" onclick="handleUndo()">撤销编辑</button>
                        </div>

                        <hr class="divider">
                        <h3>改尺寸</h3>
                        <div class="row">
                            <div class="form-group" style="flex:1"><label>宽(px)</label><input type="number" id="resizeW" value="512" min="1"></div>
                            <div class="form-group" style="flex:1"><label>高(px)</label><input type="number" id="resizeH" value="512" min="1"></div>
                            <button class="btn" id="resizeBtn" onclick="handleResize()" style="align-self:flex-end">应用尺寸</button>
                        </div>

                        <hr class="divider">
                        <h3>改风格</h3>
                        <div class="form-group"><label>新风格</label><input id="newStyleInput" placeholder="例如：水墨风格"></div>
                        <div class="form-group"><div class="checkbox-row"><input type="checkbox" id="keepContentCb" checked><label style="margin:0">保持画面内容不变</label></div></div>
                        <button class="btn" id="styleBtn" onclick="handleStyleChange()">应用风格</button>

                        <hr class="divider">
                        <button class="btn btn-primary btn-lg" onclick="navToSave()">进入保存 →</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Save Page -->
        <div id="page-save" class="page">
            <div class="card">
                <div class="row" style="justify-content:space-between">
                    <h2>图片保存</h2>
                    <button class="btn btn-sm" onclick="showPage('edit')">← 返回编辑</button>
                </div>
                <div class="row" style="align-items:flex-start">
                    <div class="col">
                        <img id="saveImage" class="image-preview" src="" alt="待保存图片" style="display:none">
                        <div id="saveStatus" class="status"></div>
                    </div>
                    <div class="col">
                        <h3>保存选项</h3>
                        <div class="form-group"><label>文件名</label><input id="saveFilename" placeholder="输入文件名（不含扩展名）"></div>
                        <div class="form-group"><label>保存格式</label>
                            <select id="saveFormat"><option>PNG</option><option>JPEG</option><option>WebP</option></select>
                        </div>
                        <button class="btn btn-primary btn-lg" id="saveExecBtn" onclick="handleSaveExecute()">保存到本地</button>
                        <div style="margin-top:12px">
                            <a id="saveDownload" class="download-link" href="#" download>下载文件</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
// ============================================================
// State
// ============================================================
const STEPS = [
    { id: 'home', label: '选择模式' },
    { id: 'generate', label: '图片生成' },
    { id: 'edit', label: '图片编辑' },
    { id: 'save', label: '图片保存' },
];

const state = {
    gen: { paths: [], urls: [], prompt: '', content: '', style: '', transparent: false },
    edit: { path: '', url: '', prevPath: '', prevUrl: '', style: '', prompt: '' },
    selectedGenIdx: 0,
};

// ============================================================
// Navigation
// ============================================================
function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const page = document.getElementById('page-' + name);
    if (page) page.classList.add('active');
    renderSteps(name);
}

function renderSteps(currentId) {
    const currentIdx = STEPS.findIndex(s => s.id === currentId);
    const container = document.getElementById('stepsContainer');
    container.innerHTML = STEPS.map((s, i) => {
        let cls, dotChar;
        if (i < currentIdx) { cls = 'step-done'; dotChar = '✓'; }
        else if (i === currentIdx) { cls = 'step-current'; dotChar = '●'; }
        else { cls = 'step-future'; dotChar = ''; }
        const line = i < STEPS.length - 1 ? `<div class="step-line"></div>` : '';
        return `<div class="step-item ${cls}">
            <div class="step-marker"><div class="step-dot">${dotChar}</div>${line}</div>
            <div class="step-label">${s.label}</div>
        </div>`;
    }).join('');
}

// ============================================================
// API Helper
// ============================================================
async function apiCall(endpoint, data) {
    const resp = await fetch('/api' + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
    });
    return resp.json();
}

async function apiUpload(file) {
    const form = new FormData();
    form.append('file', file);
    const resp = await fetch('/api/upload', { method: 'POST', body: form });
    return resp.json();
}

function setLoading(btn, loading) {
    btn.disabled = loading;
    btn._origText = btn._origText || btn.textContent;
    btn.textContent = loading ? btn._origText + '...' : btn._origText;
}

function showStatus(id, msg, isError) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'status ' + (isError ? 'status-error' : 'status-success');
}

// ============================================================
// Generate Page
// ============================================================
function navToGenerate() {
    state.gen = { paths: [], urls: [], prompt: '', content: '', style: '', transparent: false };
    document.getElementById('genContent').value = '';
    document.getElementById('genStyle').value = '';
    document.getElementById('genSize').value = '2048*2048';
    document.getElementById('genTransparent').checked = false;
    document.querySelectorAll('.image-gallery img').forEach(img => { img.src = ''; img.style.display = 'none'; img.classList.remove('selected'); });
    document.getElementById('genSelect').innerHTML = '<option>图1</option>';
    document.getElementById('genStatus').textContent = '';
    document.getElementById('genStatus').className = 'status';
    state.selectedGenIdx = 0;
    showPage('generate');
}

async function handleGenerate() {
    const content = document.getElementById('genContent').value;
    const style = document.getElementById('genStyle').value;
    if (!content.trim()) { showStatus('genStatus', '请输入内容描述', true); return; }
    if (!style.trim()) { showStatus('genStatus', '请输入风格描述', true); return; }

    const btn = document.getElementById('genBtn');
    setLoading(btn, true);
    showStatus('genStatus', '', false);

    try {
        const size = document.getElementById('genSize').value;
        const transparent = document.getElementById('genTransparent').checked;
        const resp = await apiCall('/generate', { content, style, size, transparent });
        if (!resp.success) { showStatus('genStatus', resp.error, true); return; }

        state.gen.paths = resp.images.map(i => i.path);
        state.gen.urls = resp.images.map(i => i.url);
        state.gen.prompt = resp.prompt;
        state.gen.content = content.trim();
        state.gen.style = style.trim();
        state.gen.transparent = transparent;

        ['genImg1', 'genImg2', 'genImg3'].forEach((id, i) => {
            const img = document.getElementById(id);
            if (i < resp.images.length) {
                img.src = resp.images[i].display_url;
                img.style.display = '';
                img.classList.toggle('selected', i === 0);
            } else {
                img.src = '';
                img.style.display = 'none';
                img.classList.remove('selected');
            }
        });
        state.selectedGenIdx = 0;

        const select = document.getElementById('genSelect');
        select.innerHTML = resp.images.map((_, i) => `<option>图${i + 1}</option>`).join('');
        select.value = '图1';

        showStatus('genStatus', `生成成功，共${resp.images.length}张`, false);
    } catch (e) {
        showStatus('genStatus', '生成失败: ' + e.message, true);
    } finally {
        setLoading(btn, false);
    }
}

async function handleRegenerate() {
    await handleGenerate();
}

function handleResetGen() {
    document.getElementById('genContent').value = '';
    document.getElementById('genStyle').value = '';
    document.getElementById('genSize').value = '2048*2048';
    document.getElementById('genTransparent').checked = false;
    document.querySelectorAll('.image-gallery img').forEach(img => { img.src = ''; img.style.display = 'none'; img.classList.remove('selected'); });
    document.getElementById('genSelect').innerHTML = '<option>图1</option>';
    document.getElementById('genStatus').textContent = '';
    document.getElementById('genStatus').className = 'status';
    state.gen = { paths: [], urls: [], prompt: '', content: '', style: '', transparent: false };
    state.selectedGenIdx = 0;
}

function selectGenImage(idx) {
    state.selectedGenIdx = idx;
    document.querySelectorAll('.image-gallery img').forEach((img, i) => img.classList.toggle('selected', i === idx));
    const select = document.getElementById('genSelect');
    const opt = select.querySelectorAll('option')[idx];
    if (opt) select.value = opt.value;
}

// ============================================================
// Enter Edit (from Generate)
// ============================================================
function handleEnterEdit() {
    if (!state.gen.paths.length) {
        showStatus('genStatus', '请先生成图片', true);
        return;
    }
    const select = document.getElementById('genSelect');
    const selected = select.value;
    let idx = 0;
    if (selected) {
        idx = parseInt(selected[1]) - 1;
        if (idx >= state.gen.paths.length) idx = 0;
    }
    state.selectedGenIdx = idx;

    // Populate edit state
    state.edit.path = state.gen.paths[idx];
    state.edit.url = state.gen.urls[idx];
    state.edit.style = state.gen.style;
    state.edit.prompt = state.gen.prompt;
    state.edit.prevPath = '';
    state.edit.prevUrl = '';

    // Update UI
    const img = document.getElementById('editImage');
    img.src = '/api/outputs/' + state.gen.paths[idx].split('/').pop().split('\\').pop();
    img.style.display = '';
    document.getElementById('editStatus').textContent = '';
    document.getElementById('editStatus').className = 'status';
    document.getElementById('editInstruction').value = '';
    document.getElementById('undoBtn').style.display = 'none';
    document.getElementById('saveDownload').classList.remove('show');
    document.getElementById('editUpload').value = '';

    showPage('edit');
}

// ============================================================
// Edit Page
// ============================================================
function navToEditUpload() {
    state.edit = { path: '', url: '', prevPath: '', prevUrl: '', style: '', prompt: '' };
    document.getElementById('editImage').src = '';
    document.getElementById('editImage').style.display = 'none';
    document.getElementById('editStatus').textContent = '';
    document.getElementById('editStatus').className = 'status';
    document.getElementById('editInstruction').value = '';
    document.getElementById('undoBtn').style.display = 'none';
    document.getElementById('editUpload').value = '';
    showPage('edit');
}

async function handleUpload(input) {
    const file = input.files[0];
    if (!file) return;
    const btn = input;
    try {
        const resp = await apiUpload(file);
        if (!resp.success) { showStatus('editStatus', resp.error, true); return; }
        state.edit.path = resp.path;
        state.edit.url = '';
        state.edit.style = '';
        state.edit.prompt = '';
        state.edit.prevPath = '';
        state.edit.prevUrl = '';
        const img = document.getElementById('editImage');
        img.src = resp.display_url;
        img.style.display = '';
        document.getElementById('undoBtn').style.display = 'none';
        document.getElementById('saveDownload').classList.remove('show');
        showStatus('editStatus', '上传成功', false);
    } catch (e) {
        showStatus('editStatus', '上传失败: ' + e.message, true);
    }
}

async function handleEditSubmit() {
    const instruction = document.getElementById('editInstruction').value;
    if (!instruction.trim()) { showStatus('editStatus', '请输入编辑指令', true); return; }
    if (!state.edit.path) { showStatus('editStatus', '没有可编辑的图片', true); return; }

    const btn = document.getElementById('editSubmitBtn');
    setLoading(btn, true);
    try {
        const imageRef = state.edit.url || state.edit.path;
        const resp = await apiCall('/edit', {
            instruction: instruction.trim(),
            image_url: imageRef,
            style: state.edit.style,
            transparent: state.gen.transparent,
        });
        if (!resp.success) { showStatus('editStatus', resp.error, true); return; }

        state.edit.prevPath = state.edit.path;
        state.edit.prevUrl = state.edit.url;
        state.edit.path = resp.image.path;
        state.edit.url = resp.image.url;

        const img = document.getElementById('editImage');
        img.src = resp.image.display_url;
        document.getElementById('undoBtn').style.display = '';
        document.getElementById('saveDownload').classList.remove('show');
        showStatus('editStatus', '编辑成功', false);
    } catch (e) {
        showStatus('editStatus', '编辑失败: ' + e.message, true);
    } finally {
        setLoading(btn, false);
    }
}

async function handleUndo() {
    if (!state.edit.prevPath) { showStatus('editStatus', '没有可撤销的编辑', true); return; }
    state.edit.path = state.edit.prevPath;
    state.edit.url = state.edit.prevUrl;
    state.edit.prevPath = '';
    state.edit.prevUrl = '';
    const img = document.getElementById('editImage');
    img.src = '/api/outputs/' + state.edit.path.split('/').pop().split('\\').pop();
    document.getElementById('undoBtn').style.display = 'none';
    document.getElementById('saveDownload').classList.remove('show');
    showStatus('editStatus', '已撤销', false);
}

function navToSave() {
    if (!state.edit.path) { showStatus('editStatus', '没有可保存的图片', true); return; }
    const img = document.getElementById('saveImage');
    img.src = '/api/outputs/' + state.edit.path.split('/').pop().split('\\').pop();
    img.style.display = '';
    document.getElementById('saveStatus').textContent = '';
    document.getElementById('saveStatus').className = 'status';
    document.getElementById('saveDownload').classList.remove('show');
    showPage('save');
}

async function handleSaveExecute() {
    if (!state.edit.path) { showStatus('saveStatus', '没有可保存的图片', true); return; }
    const btn = document.getElementById('saveExecBtn');
    setLoading(btn, true);
    try {
        const fmt = document.getElementById('saveFormat').value;
        const resp = await apiCall('/save', { path: state.edit.path, format: fmt });
        if (!resp.success) { showStatus('saveStatus', resp.error, true); return; }
        const customName = document.getElementById('saveFilename').value.trim();
        const ext = { PNG: '.png', JPEG: '.jpg', WebP: '.webp' }[fmt];
        const filename = customName ? customName + ext : resp.filename;
        const link = document.getElementById('saveDownload');
        link.href = resp.display_url;
        link.download = filename;
        link.textContent = '下载: ' + filename;
        link.classList.add('show');
        showStatus('saveStatus', '已保存，点击上方链接下载', false);
    } catch (e) {
        showStatus('saveStatus', '保存失败: ' + e.message, true);
    } finally {
        setLoading(btn, false);
    }
}

async function handleResize() {
    if (!state.edit.path) { showStatus('editStatus', '没有可编辑的图片', true); return; }
    const w = parseInt(document.getElementById('resizeW').value);
    const h = parseInt(document.getElementById('resizeH').value);
    if (!w || !h) { showStatus('editStatus', '请输入有效的宽高', true); return; }

    const btn = document.getElementById('resizeBtn');
    setLoading(btn, true);
    try {
        const resp = await apiCall('/resize', { path: state.edit.path, width: w, height: h });
        if (!resp.success) { showStatus('editStatus', resp.error, true); return; }
        state.edit.path = resp.path;
        state.edit.prevPath = '';
        state.edit.prevUrl = '';
        const img = document.getElementById('editImage');
        img.src = resp.display_url;
        document.getElementById('undoBtn').style.display = 'none';
        document.getElementById('saveDownload').classList.remove('show');
        showStatus('editStatus', `尺寸已改为 ${w}x${h}`, false);
    } catch (e) {
        showStatus('editStatus', '改尺寸失败: ' + e.message, true);
    } finally {
        setLoading(btn, false);
    }
}

async function handleStyleChange() {
    const newStyle = document.getElementById('newStyleInput').value;
    if (!newStyle.trim()) { showStatus('editStatus', '请输入新风格', true); return; }
    if (!state.edit.path) { showStatus('editStatus', '没有可编辑的图片', true); return; }

    const btn = document.getElementById('styleBtn');
    setLoading(btn, true);
    try {
        const keepContent = document.getElementById('keepContentCb').checked;
        const imageRef = state.edit.url || state.edit.path;
        const resp = await apiCall('/style-change', {
            new_style: newStyle.trim(),
            keep_content: keepContent,
            image_url: imageRef,
            gen_prompt: state.edit.prompt,
            transparent: state.gen.transparent,
        });
        if (!resp.success) { showStatus('editStatus', resp.error, true); return; }

        state.edit.prevPath = state.edit.path;
        state.edit.prevUrl = state.edit.url;
        state.edit.path = resp.image.path;
        state.edit.url = resp.image.url;
        state.edit.style = newStyle.trim();
        state.edit.prompt = resp.prompt;

        const img = document.getElementById('editImage');
        img.src = resp.image.display_url;
        document.getElementById('undoBtn').style.display = '';
        document.getElementById('saveDownload').classList.remove('show');
        showStatus('editStatus', `风格已改为 ${newStyle.trim()}`, false);
    } catch (e) {
        showStatus('editStatus', '改风格失败: ' + e.message, true);
    } finally {
        setLoading(btn, false);
    }
}

// ============================================================
// Init

renderSteps('home');
</script>
